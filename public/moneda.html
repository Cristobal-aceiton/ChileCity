<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cara o Cruz — Casino ChileCity RP</title>
    <link rel="icon" type="image/webp" href="/logo.webp">
    <link rel="apple-touch-icon" href="/logo.webp">
    <link rel="stylesheet" href="/css/casino-stake.css?v=2">
</head>
<body class="cs-body">

    <div id="bg-fx" aria-hidden="true"></div>
    <div class="cs-overlay" aria-hidden="true"></div>

    <div class="cs-banner-construccion">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
        Casino en construcción — puede que encuentres algún error mientras seguimos mejorándolo.
    </div>

    <div class="cs-topbar">
        <a href="/casino.html" class="btn-volver-dash" style="margin:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
            </svg>
            Casino
        </a>
        <div class="cs-saldo-chip">
            <span class="lbl">Saldo</span>
            <strong id="saldo">$0</strong>
        </div>
    </div>

    <div class="cs-game-header">
        <h1>Cara o Cruz</h1>
        <p>50/50 — paga el doble al ganar</p>
    </div>

    <div class="cs-wrap">

        <!-- Panel de apuesta -->
        <div class="cs-panel">
            <div class="cs-panel-card">
                <div class="cs-tabs">
                    <div class="cs-tab activa">Manual</div>
                    <div class="cs-tab">Automático</div>
                </div>

                <div id="mn-mensaje" class="cs-mensaje"></div>

                <div class="cs-campo">
                    <label>Elige un lado</label>
                    <div id="mn-opciones" class="cs-opciones">
                        <button type="button" class="mn-opcion cs-opcion" data-valor="cara">Cara</button>
                        <button type="button" class="mn-opcion cs-opcion" data-valor="cruz">Cruz</button>
                    </div>
                </div>

                <div class="cs-campo">
                    <label for="mn-monto">Monto a apostar</label>
                    <div class="cs-monto-row">
                        <input type="number" id="mn-monto" min="1000" step="1000" value="1000">
                        <div class="cs-quick">
                            <button type="button" data-mult="0.5">½</button>
                            <button type="button" data-mult="2">2×</button>
                        </div>
                    </div>
                </div>

                <button type="button" id="mn-lanzar" class="cs-btn cs-btn-green">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8" stroke-linecap="round"/></svg>
                    Lanzar
                </button>
            </div>
        </div>

        <!-- Moneda -->
        <div class="cs-stage">
            <div class="cs-stage-card">
                <div class="mn-scene">
                    <div class="mn-sombra"></div>
                    <div class="mn-moneda" id="mn-moneda">
                        <div class="mn-cara">
                            <div class="mn-anillo"></div>
                            <div class="mn-simbolo">$</div>
                            <div class="mn-etiqueta">CARA</div>
                        </div>
                        <div class="mn-cruz">
                            <div class="mn-anillo"></div>
                            <div class="mn-simbolo">C</div>
                            <div class="mn-etiqueta">CRUZ</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="mn-historial" class="cs-historial">
        <h2>Historial</h2>
        <ul id="mn-historial-lista"></ul>
    </div>

    <script src="/js/moneda.js?v=1" defer></script>
    <script>
        // Botones rápidos ½ / 2× del monto de apuesta
        (function () {
            const elMonto = document.getElementById('mn-monto');
            document.querySelectorAll('.cs-quick button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mult = Number(btn.dataset.mult);
                    const actual = Number(elMonto.value) || 0;
                    let nuevo = Math.max(1000, Math.round((actual * mult) / 1000) * 1000);
                    elMonto.value = nuevo;
                    elMonto.dispatchEvent(new Event('input'));
                });
            });
        })();
    </script>

</body>
</html>

<style>
.mn-opcion.seleccionada {
    border-color: var(--cs-green); color: var(--cs-green);
    background: linear-gradient(160deg, rgba(18,224,138,.22), rgba(18,224,138,.08));
    box-shadow: 0 0 0 2px rgba(18,224,138,.3);
}

.mn-scene {
    width: 220px; height: 220px; margin: 0 auto; perspective: 900px;
    display: flex; align-items: center; justify-content: center; position: relative;
}
.mn-sombra {
    position: absolute; bottom: 6px; left: 50%; width: 130px; height: 22px;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.45), rgba(0,0,0,0) 72%);
    filter: blur(1px);
}
.mn-moneda {
    width: 180px; height: 180px; position: relative; transform-style: preserve-3d;
    transition: transform .1s; border-radius: 50%;
}
.mn-moneda.girando { animation: mnFlip 1.6s cubic-bezier(.45,.05,.55,.95) forwards; }
@keyframes mnFlip {
    0%   { transform: rotateY(0) rotateX(0); }
    20%  { transform: rotateY(360deg) rotateX(8deg); }
    50%  { transform: rotateY(1080deg) rotateX(-6deg); }
    80%  { transform: rotateY(1800deg) rotateX(4deg); }
    100% { transform: rotateY(2160deg) rotateX(0); }
}

/* ── Caras de la moneda (relieve dorado, sin texto plano) ───────────────── */
.mn-cara, .mn-cruz {
    position: absolute; inset: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background:
        radial-gradient(circle at 35% 28%, rgba(255,255,255,.55), rgba(255,255,255,0) 30%),
        radial-gradient(circle at 50% 50%, #f5d982 0%, #e0ac3d 45%, #b1791f 78%, #8a5c15 100%);
    box-shadow:
        inset 0 0 0 5px rgba(255,244,214,.55),
        inset 0 0 0 7px rgba(120,80,10,.5),
        inset 0 8px 16px rgba(255,255,255,.35),
        inset 0 -10px 18px rgba(0,0,0,.35);
}
.mn-cara { transform: translateZ(8px); }
.mn-cruz { transform: rotateY(180deg) translateZ(8px); }

.mn-anillo {
    position: absolute; inset: 12px; border-radius: 50%;
    border: 2px dashed rgba(120,80,10,.45);
}
.mn-simbolo {
    font-family: 'Bebas Neue', Arial, sans-serif; font-size: 56px; line-height: 1;
    color: #7c5410; text-shadow: 0 1px 0 rgba(255,244,214,.7), 0 -1px 1px rgba(90,58,6,.6);
}
.mn-etiqueta {
    font-family: 'Bebas Neue', Arial, sans-serif; font-size: 12px; letter-spacing: 3px;
    color: rgba(124,84,16,.85);
}

/* ── Canto (borde) de la moneda: le da el volumen 3D real ───────────────── */
.mn-canto-seg {
    position: absolute; left: 50%; top: 50%; width: 13px; height: 16px;
    margin-left: -6.5px; margin-top: -8px;
    background: linear-gradient(180deg, #f6d97e 0%, #b1791f 50%, #6e470f 100%);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.mn-canto-seg.mn-canto-alt { filter: brightness(.78); }
</style>
<script>
    // Genera el canto (borde cilíndrico) de la moneda con divs en 3D,
    // para que la moneda se vea como un disco real y no una imagen plana.
    (function () {
        const moneda = document.getElementById('mn-moneda');
        if (!moneda) return;
        const SEGMENTOS = 48;
        const RADIO = 89;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < SEGMENTOS; i++) {
            const seg = document.createElement('div');
            seg.className = 'mn-canto-seg' + (i % 2 === 0 ? ' mn-canto-alt' : '');
            seg.style.transform = `rotateY(${(360 / SEGMENTOS) * i}deg) translateZ(${RADIO}px)`;
            frag.appendChild(seg);
        }
        moneda.appendChild(frag);
    })();
</script>
