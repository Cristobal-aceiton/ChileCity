<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minas — Casino ChileCity RP</title>
    <link rel="icon" type="image/webp" href="/logo.webp">
    <link rel="apple-touch-icon" href="/logo.webp">
    <link rel="stylesheet" href="/css/casino-stake.css?v=1">
</head>
<body class="cs-body">

    <div id="bg-fx" aria-hidden="true"></div>
    <div class="cs-overlay" aria-hidden="true"></div>

    <div class="cs-banner-construccion">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
        Casino en construcción — puede que encuentres algún error mientras seguimos mejorándolo.
    </div>

    <div class="cs-topbar">
        <a href="/casino.html" class="btn-volver-dash" style="margin:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
            </svg>
            Casino
        </a>
        <div class="cs-saldo-chip">
            <span class="lbl">Saldo</span>
            <strong id="saldo">$0</strong>
        </div>
    </div>

    <div class="cs-game-header">
        <h1>Minas</h1>
        <p>Descubre casillas, retira cuando quieras</p>
    </div>

    <div class="cs-wrap">

        <!-- Panel de apuesta -->
        <div class="cs-panel">
            <div class="cs-panel-card">
                <div class="cs-tabs">
                    <div class="cs-tab activa">Manual</div>
                    <div class="cs-tab">Automático</div>
                </div>

                <div id="mi-mensaje" class="cs-mensaje"></div>

                <!-- Configuración de la partida (visible antes de empezar) -->
                <div id="mi-config" style="display:flex; flex-direction:column; gap:14px;">
                    <div class="cs-campo">
                        <label for="mi-monto">Monto de apuesta</label>
                        <div class="cs-monto-row">
                            <input type="number" id="mi-monto" min="1000" step="1000" value="1000">
                            <div class="cs-quick">
                                <button type="button" data-mult="0.5">½</button>
                                <button type="button" data-mult="2">2×</button>
                            </div>
                        </div>
                    </div>
                    <div class="cs-campo">
                        <label for="mi-minas">Cantidad de minas</label>
                        <select id="mi-minas" class="cs-select"></select>
                    </div>
                    <button type="button" id="mi-iniciar" class="cs-btn cs-btn-red">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/>
                        </svg>
                        Iniciar partida
                    </button>
                </div>

                <!-- Info de la partida en curso -->
                <div id="mi-info" class="mi-oculto" style="flex-direction:column; gap:14px;">
                    <div class="cs-stat-row">
                        <div class="cs-stat">
                            <span>Multiplicador</span>
                            <b id="mi-mult">x1.00</b>
                        </div>
                        <div class="cs-stat">
                            <span>Si retiras</span>
                            <b id="mi-premio">$0</b>
                        </div>
                    </div>
                    <button type="button" id="mi-retirar" class="mi-oculto cs-btn cs-btn-green">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 19V5M5 12l7-7 7 7"/>
                        </svg>
                        Retirar
                    </button>
                </div>
            </div>
        </div>

        <!-- Tablero -->
        <div class="cs-stage">
            <div class="cs-stage-card">
                <div id="mi-tablero" class="mi-oculto"></div>
                <div id="mi-tablero-vacio" style="color:rgba(255,255,255,.35); font-size:13px; text-align:center; max-width:260px;">
                    Configura tu apuesta y presiona <b>Iniciar partida</b> para ver el tablero.
                </div>
            </div>
        </div>

    </div>

    <div id="mi-historial" class="cs-historial">
        <h2>Historial</h2>
        <ul id="mi-historial-lista"></ul>
    </div>

    <!-- Plantillas SVG reutilizadas por JS para pintar casillas (sin emojis) -->
    <template id="mi-tpl-diamante">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12l4 6-10 12L2 9Z"/></svg>
    </template>
    <template id="mi-tpl-mina">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="13" r="7"/><path d="M12 2v3M4.2 6.2l2.1 2.1M19.8 6.2l-2.1 2.1M9 2h6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    </template>

    <script src="/js/casino-sfx.js?v=1"></script>
    <script src="/js/mines.js?v=2" defer></script>
    <script>
        // Botones rápidos ½ / 2× del monto de apuesta + mostrar/ocultar placeholder del tablero
        (function () {
            const elMonto = document.getElementById('mi-monto');
            document.querySelectorAll('#mi-config .cs-quick button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mult = Number(btn.dataset.mult);
                    const actual = Number(elMonto.value) || 0;
                    let nuevo = Math.max(1000, Math.round((actual * mult) / 1000) * 1000);
                    elMonto.value = nuevo;
                    elMonto.dispatchEvent(new Event('input'));
                });
            });

            const elTablero = document.getElementById('mi-tablero');
            const elVacio = document.getElementById('mi-tablero-vacio');
            const obs = new MutationObserver(() => {
                elVacio.style.display = elTablero.classList.contains('mi-oculto') ? '' : 'none';
            });
            obs.observe(elTablero, { attributes: true, attributeFilter: ['class'] });
        })();
    </script>

</body>
</html>

<style>
.mi-oculto { display: none !important; }
.mi-gano { color: #4ade80; }
#mi-info { display: flex; }
.mi-mult-anim { animation: miMultPop .3s ease; }
@keyframes miMultPop { 0%{transform:scale(1);} 50%{transform:scale(1.18); color:#4ade80;} 100%{transform:scale(1);} }
.mi-saldo-anim { animation: csPulse .4s ease; }

/* ── Tablero de minas (5x5) ────────────────────────────────────────────── */
#mi-tablero {
    width: 100%;
    max-width: 340px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}
#mi-tablero.mi-shake { animation: miTableroShake .4s ease; }
@keyframes miTableroShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); } 40% { transform: translateX(5px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(3px); }
}
.mi-casilla {
    aspect-ratio: 1; border-radius: 10px; border: 1px solid rgba(255,255,255,.1);
    background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    box-shadow: 0 4px 12px rgba(0,0,0,.25); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
    color: transparent; position: relative; overflow: hidden;
}
.mi-casilla:hover:not(.mi-revelada):not(.mi-mina):not(:disabled) {
    background: rgba(255,255,255,.14); transform: scale(1.05);
}
.mi-casilla.mi-revelada {
    background: rgba(18,224,138,.16); border-color: rgba(18,224,138,.4); color: #12e08a;
    cursor: default; animation: miRevelar .3s cubic-bezier(.16,1,.3,1);
}
@keyframes miRevelar { 0%{transform:scale(.6); opacity:0;} 60%{transform:scale(1.15); opacity:1;} 100%{transform:scale(1); opacity:1;} }
.mi-casilla.mi-mina { background: rgba(239,68,68,.22); border-color: rgba(239,68,68,.5); color: #f87171; cursor: default; }
.mi-casilla.mi-mina.mi-mina-detonada { animation: miExplotar .5s ease; }
@keyframes miExplotar {
    0% { transform: scale(1); background: rgba(239,68,68,.22); }
    25% { transform: scale(1.35); background: rgba(239,68,68,.65); box-shadow: 0 0 30px rgba(239,68,68,.9); }
    55% { transform: scale(.92); } 100% { transform: scale(1); background: rgba(239,68,68,.22); }
}
.mi-onda { position: absolute; inset: 0; border-radius: 10px; border: 2px solid rgba(239,68,68,.85); opacity: 0; pointer-events: none; }
.mi-onda.mi-onda-activa { animation: miOnda .55s ease-out forwards; }
@keyframes miOnda { 0%{transform:scale(.6); opacity:.9;} 100%{transform:scale(2.4); opacity:0;} }
.mi-casilla:disabled { cursor: not-allowed; }
</style>
