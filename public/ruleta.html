<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta — Casino ChileCity RP</title>
    <link rel="icon" type="image/webp" href="/logo.webp">
    <link rel="apple-touch-icon" href="/logo.webp">
    <link rel="stylesheet" href="/css/casino-stake.css?v=1">
</head>
<body class="cs-body">

    <div id="bg-fx" aria-hidden="true"></div>
    <div class="cs-overlay" aria-hidden="true"></div>

    <div class="cs-banner-construccion">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
        Casino en construcción — puede que encuentres algún error mientras seguimos mejorándolo.
    </div>

    <div class="cs-topbar">
        <a href="/casino.html" class="btn-volver-dash" style="margin:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
            </svg>
            Casino
        </a>
        <div class="cs-saldo-chip">
            <span class="lbl">Saldo</span>
            <strong id="saldo">$0</strong>
        </div>
    </div>

    <div class="cs-game-header">
        <h1>Ruleta</h1>
        <p>Apuesta a rojo, negro o verde — el verde paga x14</p>
    </div>

    <div class="cs-wrap">

        <!-- Panel de apuesta -->
        <div class="cs-panel">
            <div class="cs-panel-card">
                <div class="cs-tabs">
                    <div class="cs-tab activa">Manual</div>
                    <div class="cs-tab">Automático</div>
                </div>

                <div id="rul-mensaje" class="cs-mensaje"></div>

                <div class="cs-campo">
                    <label>Elige un color</label>
                    <div id="rul-opciones" class="cs-opciones"></div>
                </div>

                <div class="cs-campo">
                    <label for="rul-monto">Monto a apostar</label>
                    <div class="cs-monto-row">
                        <input type="number" id="rul-monto" min="1000" step="1000" value="1000">
                        <div class="cs-quick">
                            <button type="button" data-mult="0.5">½</button>
                            <button type="button" data-mult="2">2×</button>
                        </div>
                    </div>
                </div>

                <button type="button" id="rul-girar" class="cs-btn cs-btn-green">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>
                    Girar ruleta
                </button>
            </div>
        </div>

        <!-- Rueda -->
        <div class="cs-stage">
            <div class="cs-stage-card">
                <div class="rul-scene">
                    <div class="rul-puntero"></div>
                    <div class="rul-aro">
                        <canvas id="rul-canvas" width="260" height="260"></canvas>
                    </div>
                    <div id="rul-resultado-chip" class="rul-chip"></div>
                </div>
            </div>
        </div>

    </div>

    <div id="rul-historial" class="cs-historial">
        <h2>Historial</h2>
        <ul id="rul-historial-lista"></ul>
    </div>

    <script src="/js/casino-sfx.js?v=1"></script>
    <script src="/js/ruleta.js?v=1" defer></script>
    <script>
        // Botones rápidos ½ / 2× del monto de apuesta
        (function () {
            const elMonto = document.getElementById('rul-monto');
            document.querySelectorAll('.cs-quick button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mult = Number(btn.dataset.mult);
                    const actual = Number(elMonto.value) || 0;
                    let nuevo = Math.max(1000, Math.round((actual * mult) / 1000) * 1000);
                    elMonto.value = nuevo;
                    elMonto.dispatchEvent(new Event('input'));
                });
            });
        })();
    </script>

</body>
</html>

<style>
.rul-gano { color: #4ade80; }
.rul-saldo-anim { animation: csPulse .4s ease; }

/* Botones de color generados por ruleta.js */
#rul-opciones { display: flex; gap: 8px; }
.rul-opcion {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    color: #fff; border: 2px solid var(--cs-border); padding: 11px 6px; border-radius: 12px;
    font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all .18s cubic-bezier(.16,1,.3,1);
}
.rul-opcion-mult { font-weight: 700; font-size: 10px; color: rgba(255,255,255,.4); }
.rul-opcion.rojo svg { color: #ff4d4d; }
.rul-opcion.negro svg { color: #ddd; }
.rul-opcion.verde svg { color: var(--cs-green); }
.rul-opcion:hover { transform: translateY(-2px); background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.03)); }
.rul-opcion.seleccionada { box-shadow: 0 0 0 2px currentColor; }
.rul-opcion.rojo.seleccionada { border-color: #e02020; color: #ff6b6b; background: linear-gradient(160deg, rgba(224,32,32,.22), rgba(224,32,32,.08)); }
.rul-opcion.negro.seleccionada { border-color: rgba(255,255,255,.6); color: #eee; background: linear-gradient(160deg, rgba(255,255,255,.15), rgba(255,255,255,.04)); }
.rul-opcion.verde.seleccionada { border-color: var(--cs-green); color: var(--cs-green); background: linear-gradient(160deg, rgba(18,224,138,.22), rgba(18,224,138,.08)); }
.rul-opcion:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.rul-scene {
    width: 260px; height: 260px; margin: 0 auto;
    position: relative; display: flex; align-items: center; justify-content: center;
}
.rul-puntero {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent;
    border-top: 18px solid var(--cs-gold); filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); z-index: 4;
}
.rul-aro {
    width: 254px; height: 254px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
    border: 6px solid; border-image: linear-gradient(135deg, #f5d06b, #b8860b 40%, #f5d06b 70%, #8a6d1a) 1;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 18px 50px rgba(0,0,0,.6), inset 0 0 30px rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
}
#rul-canvas { display: block; border-radius: 50%; box-shadow: inset 0 0 24px rgba(0,0,0,.6); }
#rul-canvas.rul-girando { transition: transform 4.6s cubic-bezier(.15,.65,.2,1); }
.rul-chip {
    position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%) scale(.8);
    padding: 6px 16px; border-radius: 20px; font-family: 'Bebas Neue', sans-serif; font-size: 16px;
    letter-spacing: 1px; text-transform: uppercase; color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.5);
    display: none; z-index: 5;
}
.rul-chip.rul-chip-anim { animation: rulChipPop .35s cubic-bezier(.16,1,.3,1); }
@keyframes rulChipPop { 0%{transform:translateX(-50%) scale(.5); opacity:0;} 70%{transform:translateX(-50%) scale(1.08); opacity:1;} 100%{transform:translateX(-50%) scale(1); opacity:1;} }
#rul-girar svg.rul-spin { animation: rulSpinIcon 1s linear infinite; }
@keyframes rulSpinIcon { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

@media (max-width: 420px) {
    .rul-scene { width: 230px; height: 230px; }
    .rul-aro { width: 224px; height: 224px; }
    #rul-canvas { width: 214px !important; height: 214px !important; }
}
</style>
